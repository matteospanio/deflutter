[project]
name = "deflutter"
version = "0.1.0"
description = "Reference-tone based correction of frequency drift (wow/flutter-like anomalies) in audio recordings"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "soundfile>=0.12",
]

[project.scripts]
deflutter = "deflutter.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
